# 고정 카메라 이름 ↔ USB 포트 (OV9281 보드 4대, 시리얼이 모두 SN0001 이라 꽂은 포트로 구분)
# 이름 규칙 (사용자 정의, 2026-11-24): 모니터 쪽을 정면으로 볼 때 정면 왼쪽(문 바로 위)이 cam1, 위에서 보아 시계 방향으로 cam2~cam4
# port = /dev/v4l/by-path/pci-0000:<port 앞부분>-usb-0:<포트 번호>:1.0-video-index0 의 줄임 (cv/capture/preview_server.py port_of)
# 카메라를 다른 USB 포트에 옮겨 꽂으면 이 파일도 고친다.
# 영상 방향: 4대 모두 옆으로 달려 있어 반시계 90° 돌리면 바로 섬 (preview_server --rotate ccw). 캘리브레이션은 원본 방향 그대로.

cameras:
  cam2:
    port: "0e:00.3-2"        # 2026-11-24 사용자가 떼어 낸 카메라 = 이 포트 뽑힘/다시 꽂힘(23:51~23:56)으로 확인
    status: "케이스 초점 나사 부러짐 → 새 케이스 주문, 약 5일 뒤 재장착 (카메라 보드 자체는 정상)"
  # cam1, cam3, cam4: 남은 포트 0b:00.0-5, 0b:00.0-7, 0f:00.0-1 중 어느 것인지 다음 세션에 지정 (렌즈를 차례로 가리기)
